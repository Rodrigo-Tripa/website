<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Knowledge Graph | Rodrigo Tripa</title>
    <meta name="description" content="Interactive visualization of my Cyber Notes knowledge base.">

    <!-- Theme -->
    <meta name="theme-color" content="#050505">

    <!-- Icons -->
    <link rel="icon" href="/assets/icons/favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/knowledge.css">
    <link rel="stylesheet" href="/assets/js/vendor/vis-network.min.css">

    <script src="assets/js/vendor/marked.min.js"></script>

</head>

<body>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                Rodrigo Tripa
            </a>

            <nav class="navbar">
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/projects.html">Projects</a></li>
                    <li><a href="/knowledge.html" class="active">Knowledge</a></li>
                    <li><a href="/security.html">Security</a></li>
                    <li><a href="/research.html">Research</a></li>
                    <li><a href="/ia.html">AI Assistant</a></li>
                    <li><a href="/about.html">About</a></li>
                </ul>
            </nav>

            <div class="social-links">
                <a href="https://github.com/Rodrigo-Tripa" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    GitHub
                </a>
                <a href="https://www.linkedin.com/in/rodrigo-tripa" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    LinkedIn
                </a>
            </div>

            <button class="menu-toggle" aria-label="Toggle Navigation Menu">
                ☰
            </button>
        </div>
    </header>

    <script src="/assets/js/header-offset.js"></script>

    <main id="knowledge-main" class="is-collapsed">

        <aside id="markdown-panel" class="hidden">

            <button type="button" class="panel-close" id="close-markdown" aria-label="Close notes panel">✕</button>

            <div id="markdown-content">

                <p>Select a note...</p>

            </div>

        </aside>

        <div id="panel-resizer" class="panel-resizer" aria-hidden="true"></div>

        <section class="graph-container">

            <div id="cy"></div>

        </section>

        <aside class="sidebar" id="info-sidebar">

            <button type="button" class="panel-close" id="close-sidebar" aria-label="Close info panel">✕</button>

            <h2>Knowledge Graph</h2>

            <p>
                Select a node to display information about the note.
            </p>

            <hr>

            <div id="node-info">

                <h3>No node selected</h3>

                <p>
                    Click a node in the graph.
                </p>

            </div>

        </aside>

    </main>

    <div class="panel-backdrop" id="panel-backdrop"></div>

    <button type="button" class="mobile-toggle mobile-toggle--notes" id="mobile-toggle-notes" aria-label="Open notes panel">📄</button>
    <button type="button" class="mobile-toggle mobile-toggle--info" id="mobile-toggle-info" aria-label="Open info panel">ℹ️</button>
        <script src="assets/js/vendor/vis-network.min.js"></script>

        <script src="/assets/js/github.js"></script>
        <script src="/assets/js/parser.js"></script>
        <script src="/assets/js/graph.js"></script>
        <script src="/assets/js/ui.js"></script>
        <script src="/assets/js/knowledge.js"></script>
        <script src="/assets/js/mobile-panels.js"></script>

</body>

</html>
